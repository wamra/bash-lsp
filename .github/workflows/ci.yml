name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is left out of the automatic run on purpose: it is the development
  # platform and its hosted runners cost about ten times the Linux rate. The
  # `test-macos` job below runs on manual dispatch only.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The tests must not read a settings file of the machine they run on.
      - name: Test
        shell: bash
        env:
          BASH_LSP_CONFIG: ${{ runner.temp }}/bash-lsp-no-such-file.toml
        run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        env:
          BASH_LSP_CONFIG: ${{ runner.temp }}/bash-lsp-no-such-file.toml
        run: go test -race ./...

  # Manual only: the same steps as `test`, once per release, for the cost
  # reason above.
  test-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test
        env:
          BASH_LSP_CONFIG: ${{ runner.temp }}/bash-lsp-no-such-file.toml
        run: go test ./...

  # Cross-builds the six release archives and keeps them for a week.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bash-lsp-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Builds the installable plugin (launcher plus the six binaries) and
  # force-pushes it as the orphan "plugin" branch, which the marketplace entry
  # installs from. One commit, so history stays small.
  plugin:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: scripts/build-plugin.sh "$RUNNER_TEMP/plugin"
      - run: scripts/check-plugin.sh "$RUNNER_TEMP/plugin"
      - name: Push the plugin branch
        working-directory: ${{ runner.temp }}/plugin
        run: |
          git init -q -b plugin
          git config user.name "wamra"
          git config user.email "wamra@users.noreply.github.com"
          git add -A
          git commit -q -m "Plugin build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" plugin
